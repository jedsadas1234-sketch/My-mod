
name: Build YT Lyrics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find and extract latest ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-src

          mapfile -d '' ZIP_FILES < <(
            git ls-files -z | grep -z -i '\.zip$' || true
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP files found in repository!"
            exit 1
          fi

          LATEST_ZIP=""
          LATEST_TIME=-1

          for ZIP in "${ZIP_FILES[@]}"; do
            TIME=$(git log -1 --format=%ct -- "$ZIP")

            if [ -n "$TIME" ] && [ "$TIME" -gt "$LATEST_TIME" ]; then
              LATEST_TIME=$TIME
              LATEST_ZIP="$ZIP"
            fi
          done

          if [ -z "$LATEST_ZIP" ]; then
            echo "ERROR: Cannot determine latest ZIP!"
            exit 1
          fi

          echo "Selected ZIP: $LATEST_ZIP"

          unzip -q "$LATEST_ZIP" -d build-src

          GRADLEW=$(find build-src -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Minecraft Mod
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: YT-Lyrics-Mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
