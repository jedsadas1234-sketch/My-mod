
name: Build YT Lyrics

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find latest ZIP and extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-src

          mapfile -d '' ZIP_FILES < <(
            git ls-files -z | grep -z -i '\.zip$' || true
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP found!"
            exit 1
          fi

          LATEST_ZIP=""
          LATEST_TIME=-1

          for ZIP in "${ZIP_FILES[@]}"; do
            TIME=$(git log -1 --format=%ct -- "$ZIP" || true)

            if [[ "$TIME" =~ ^[0-9]+$ ]] && [ "$TIME" -gt "$LATEST_TIME" ]; then
              LATEST_TIME=$TIME
              LATEST_ZIP="$ZIP"
            fi
          done

          if [ -z "$LATEST_ZIP" ]; then
            echo "ERROR: Cannot determine latest ZIP!"
            exit 1
          fi

          echo "Selected ZIP: $LATEST_ZIP"
          unzip -q "$LATEST_ZIP" -d build-src

          SETTINGS=$(find build-src -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD=$(find build-src -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print -quit)

            if [ -z "$BUILD" ]; then
              echo "ERROR: Gradle project not found!"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Migrate Fabric Loom for Minecraft 26.2
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])

          files = [
              *root.glob("build.gradle"),
              *root.glob("build.gradle.kts")
          ]

          if not files:
              raise SystemExit("ERROR: build.gradle not found!")

          plugin_pattern = re.compile(
              r"""(\bid\s*\(?\s*['"])fabric-loom(?:-remap)?(['"]\s*\)?)"""
          )

          for path in files:
              text = path.read_text(encoding="utf-8")

              # Use the non-remapping Loom plugin for MC 26.2.
              text = plugin_pattern.sub(
                  lambda m: m.group(1) +
                  "net.fabricmc.fabric-loom" + m.group(2),
                  text
              )

              # Remove obsolete mappings declarations.
              lines = text.splitlines(keepends=True)
              lines = [
                  line for line in lines
                  if not (
                      re.search(r"\bmappings\b", line)
                      and (
                          "officialMojangMappings" in line
                          or "net.fabricmc:yarn" in line
                      )
                  )
              ]
              text = "".join(lines)

              # Use normal Gradle configurations.
              for old, new in (
                  ("modImplementation", "implementation"),
                  ("modCompileOnly", "compileOnly"),
                  ("modRuntimeOnly", "runtimeOnly"),
                  ("modApi", "api"),
              ):
                  text = re.sub(
                      r"\b" + old + r"\b",
                      new,
                      text
                  )

              path.write_text(text, encoding="utf-8")
              print(f"Updated: {path}")

          print("Loom migration completed.")
          PY

          echo "----- BUILD CONFIGURATION -----"
          cat "$PROJECT_DIR/build.gradle" 2>/dev/null || true

      - name: Install Gradle 9.5.1
        shell: bash
        run: |
          set -euo pipefail

          VERSION=9.5.1

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle

          echo "/opt/gradle/gradle-${VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build YT Lyrics
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace clean build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: YT-Lyrics-Mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-javadoc.jar
          if-no-files-found: error
