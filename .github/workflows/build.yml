
name: Build YT Lyrics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find and extract latest ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-src

          mapfile -d '' ZIP_FILES < <(
            git ls-files -z | grep -z -i '\.zip$' || true
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP found!"
            exit 1
          fi

          LATEST_ZIP=""
          LATEST_TIME=-1

          for ZIP in "${ZIP_FILES[@]}"; do
            TIME=$(git log -1 --format=%ct -- "$ZIP")

            if [ -n "$TIME" ] && [ "$TIME" -gt "$LATEST_TIME" ]; then
              LATEST_TIME=$TIME
              LATEST_ZIP="$ZIP"
            fi
          done

          if [ -z "$LATEST_ZIP" ]; then
            echo "ERROR: Cannot find latest ZIP!"
            exit 1
          fi

          echo "Selected ZIP: $LATEST_ZIP"
          unzip -q "$LATEST_ZIP" -d build-src

          PROJECT_DIR=""

          SETTINGS=$(find build-src -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD_FILE=$(find build-src -type f \( \
              -name build.gradle \
              -o -name build.gradle.kts \
            \) -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install Gradle
        run: |
          GRADLE_VERSION=9.5.1
          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Minecraft Mod
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: YT-Lyrics-Mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
