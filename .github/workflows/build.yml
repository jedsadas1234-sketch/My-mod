
name: Build YT Lyrics

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract ZIP
        run: |
          mkdir -p build-src
          unzip -q source.zip -d build-src

          GRADLEW=$(find build-src -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Minecraft Mod
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: YT-Lyrics-Mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
